# CouncilLens — Norwich City Council, housing allocations (the Home Options scheme).
#
# Norwich owns and manages its own council housing, and Part VI of the Housing Act
# 1996 requires it to publish a scheme setting out who qualifies for social housing
# and how applicants are prioritised. In Norwich that scheme is called Home Options.
#
# This topic follows ONE round of that scheme's review, end to end:
#   feedback  a public consultation on the proposed changes, 10 November 2025, with
#             the council's own "you said, we did" write-up published afterwards
#   decision  Scrutiny committee on 15 January 2026, then Cabinet on 11 February 2026
#             agreeing the adoption, with both sets of minutes
#   outcome   the Home Options Allocation Scheme 2026, published 12 February 2026,
#             and the resident-facing page that now applies its rules
#
# Who the council is — website, tier, remit note, platforms — lives once in
# config/councils/norwich-city-council.yaml, not here.
#
# Every URL below was fetched and read on 2026-09-07 before being written down.
# Sources that could not be verified are disabled, with a note saying what was
# searched. Nothing here is a guess.
#
# Config keys the adapters understand (see src/ingest/adapters.py):
#   match / exclude   which linked documents to keep, by keyword
#   documents         explicit {title, url} documents to fetch
#   include_page      emit a record for the page itself (default true)
#   follow_links      discover linked documents (default true)
#   max_bytes         skip any single file larger than this

council: "Norwich City Council"
topic: "Housing allocations (who gets a council home, and in what order)"

sources:
  # ------------------------------------------------------------------
  # FEEDBACK — what people were asked, and what they said
  # ------------------------------------------------------------------

  # Verified 2026-09-07. The consultation page on Get Talking Norwich
  # (EngagementHQ / Granicus). It ran from 10 November 2025 and covered two
  # policies at once: the Homelessness and Rough Sleeping Strategy and the Home
  # Options allocations policy. Only the allocations documents are fetched — the
  # `match` keeps the three files whose names begin "Allocations policy 2025" and
  # leaves the homelessness strategy papers, which belong to a different topic.
  #
  # The page is doing double duty as feedback AND as the published result: below
  # the closed survey it carries the council's "You said, we did" update, which
  # names four specific changes made because of what people said. That text is the
  # strongest linkage evidence on this topic.
  - id: housing-consultation-home-options
    title: "Homelessness Strategy and Housing Allocations Policy — consultation (Get Talking Norwich)"
    type: consultation
    stage: feedback
    platform: engagement
    url: "https://gettalking.norwich.gov.uk/homelessnessandallocations"
    match:
      - allocations policy 2025
    enabled: true

  # ------------------------------------------------------------------
  # DECISION — what the council's own committees did about it
  # ------------------------------------------------------------------

  # Verified 2026-09-07. Scrutiny committee, 15 January 2026, item 4: "Revisions
  # to the Home Options Policy". This is where councillors went through the
  # proposals before Cabinet, and where the one contested point was raised — the
  # committee asked Cabinet to drop the rule that denies extra priority to families
  # in a flat with no garden where the children were born after they moved in.
  #
  # Only the minutes are fetched from this page. The officer report attached here
  # is byte-for-byte the same PDF that went to Cabinet on 11 February, and is
  # already banked under housing-cabinet-2026-02-11 below; fetching it twice would
  # put 561Kb in the repo for no gain.
  - id: housing-scrutiny-2026-01-15
    title: "Scrutiny committee, 15 January 2026 — revisions to the Home Options policy"
    type: agenda
    stage: decision
    body: "Scrutiny committee"
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Meetingscalendar/tabid/70/ctl/ViewMeetingPublic/mid/397/Meeting/1561/Committee/4/Default.aspx"
    match:
      - scrutiny minutes 15 january 2026
    exclude:
      - document pack
    max_bytes: 5000000
    enabled: true

  # Verified 2026-09-07. Cabinet, 11 February 2026, item 12: "Revisions to the Home
  # Options Policy — to agree an update to the Home Options allocation policy".
  # This is the meeting that adopted it.
  #
  # The single 561Kb PDF behind that item is the whole decision in one file: the
  # officer report (including the consultation account and the response to
  # Scrutiny), Appendix A the proposed 2026 policy with changes highlighted,
  # Appendix B the equality impact assessment, and Appendix C the consultation
  # response data — the agree / disagree / neutral split for each of the five
  # proposals. The 2Mb-plus combined agenda pack is excluded: it is the same
  # document plus fifteen unrelated items.
  - id: housing-cabinet-2026-02-11
    title: "Cabinet, 11 February 2026 — revisions to the Home Options policy"
    type: agenda
    stage: decision
    body: "Cabinet"
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Meetingscalendar/tabid/70/ctl/ViewMeetingPublic/mid/397/Meeting/1518/Committee/1/Default.aspx"
    match:
      - home options
    exclude:
      - document pack
    max_bytes: 5000000
    enabled: true

  # Verified 2026-09-07. The minutes of that Cabinet meeting are not published on
  # the meeting's own page — CMIS attaches them to the NEXT meeting, where they are
  # confirmed. So this entry points at Cabinet on 11 March 2026 and takes only one
  # document from it: the February minutes. The page itself is not banked, because
  # its own business is a different set of items.
  #
  # Minute 123.5 is the decision record in the council's own words: "RESOLVED to
  # agree the adoption of the updated Home Options policy." Minutes 123.2 and 123.3
  # carry the exchange about the garden rule, including the Cabinet member's reply
  # and the figure of 160 households who moved by mutual exchange in 2025.
  - id: housing-cabinet-minutes-2026-02-11
    title: "Minutes of the Cabinet meeting held on 11 February 2026"
    type: minutes
    stage: decision
    body: "Cabinet"
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Meetingscalendar/tabid/70/ctl/ViewMeetingPublic/mid/397/Meeting/1530/Committee/1/Default.aspx"
    include_page: false
    match:
      - minutes of the cabinet meeting held on 11 february 2026
    exclude:
      - document pack
    max_bytes: 5000000
    enabled: true

  # ------------------------------------------------------------------
  # OUTCOME — the policy that is actually in force
  # ------------------------------------------------------------------

  # Verified 2026-09-07. The adopted scheme, published 12 February 2026 — the day
  # after Cabinet agreed it. Published as a full web page rather than a PDF, with
  # the summary of changes at the top and appendices A to E below.
  #
  # Its own opening paragraph is confirmation in the council's words that this
  # document came out of the consultation: "These updates have been shaped through
  # a public consultation which took place in Autumn 2025 and scrutiny by the
  # council's Overview and Scrutiny Committee."
  #
  # follow_links is off: the one file it links is Appendix E, a bedroom-size
  # eligibility table already reproduced in the page text.
  - id: housing-adopted-home-options-2026
    title: "Home Options Allocation Scheme 2026 (adopted policy)"
    type: policy
    stage: outcome
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/your-council-explained/policies-plans-and-strategies/home-options-allocation-scheme-2026"
    follow_links: false
    enabled: true

  # Verified 2026-09-07. The page a Norwich resident actually lands on when they
  # want to apply for a council home. It is banked as evidence that the new rules
  # are the ones now being applied: it states the two-year residence requirement
  # introduced by the 2026 scheme, lists the five priority bands, and links the
  # adopted policy. Without it, the site could show a policy being adopted but not
  # that it reached the counter.
  - id: housing-applying-for-housing
    title: "Applying for housing in Norwich — how the Home Options scheme works"
    type: policy
    stage: outcome
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/housing-and-community-safety/housing-advice-and-homelessness/applying-housing-norwich"
    follow_links: false
    enabled: true

  # Verified 2026-09-07: the council's index of adopted policies. It is the page
  # that led us to the adopted scheme, and it lists fifteen other housing policies.
  # Left disabled because it is a signpost, not evidence about allocations, and
  # banking it would add a long list of unrelated policy titles to the archive.
  - id: housing-policies-index
    title: "Policies, plans and strategies (index of adopted housing policies)"
    type: policy
    stage: outcome
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/your-council-explained/policies-plans-and-strategies"
    enabled: false

  # Verified 2026-09-07: this is the URL the Cabinet report itself links for the
  # allocation scheme, and it returns HTTP 403 "Access denied — sorry, you do not
  # have access to this page" to the public. The live scheme is at the
  # -2026 address banked above. Recorded here so the next reviewer can see that the
  # council's own report points residents at a page they cannot open.
  - id: housing-home-options-legacy-url
    title: "Norwich Home Options Allocation Scheme (link used in the Cabinet report)"
    type: policy
    stage: outcome
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/your-council-explained/policies-plans-and-strategies/norwich-home-options-allocation-scheme"
    enabled: false

  # ------------------------------------------------------------------
  # TARGETS — the council's own performance framework, housing indicators
  # ------------------------------------------------------------------

  # Added 8 September 2026. Norwich runs a traffic-light performance framework
  # covering the whole council: every corporate indicator carries a Target and an
  # Intervention threshold the council sets itself, tracked quarterly against the
  # actual and reported to Cabinet. Eight of those indicators are about council
  # housing — rent collected, how long a home stands empty between tenants, gas
  # safety certificates, households in temporary accommodation, homelessness
  # prevented, homes made safe in the private rented sector, affordable homes
  # built, new homes completed — and they are the only place the council publishes
  # a target for anything on this page. So they belong here, next to the scheme
  # that decides who gets a home.
  #
  # This is the report for the first quarter of 2025/26, taken to Cabinet on
  # 10 September 2025. It carries five quarters of history for most indicators.
  #
  # ONE IMPORTANT CAVEAT, also recorded as a gap on the page. The narrative pages
  # are ordinary text, but Appendix A — the part with the numbers — is a set of
  # dashboard screenshots pasted in as images, so text extraction gets the
  # commentary and not the figures. The targets and actuals used here were read
  # off those images by eye and are flagged for human review accordingly. Data
  # published as a picture of a dashboard has been published, but not in a form
  # anyone can check by machine.
  - id: housing-corporate-performance-2025-26-q1
    title: "Corporate performance report, quarter 1 2025-26 (Cabinet, 10 September 2025)"
    type: performance
    stage: outcome
    body: "Cabinet"
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/downloads/file/11006/corporate_performance_report_for_quarter_1_2025-26"
    max_bytes: 6000000
    enabled: true

  # The council's statutory Tenant Satisfaction Measures, published under the
  # Regulator of Social Housing's regime. Twenty-six measures, from a survey of
  # 1,002 tenants, with this year's figure and last year's beside it — 75.3% of
  # tenants satisfied with the overall service, up from 71.1%; 30.0% satisfied
  # with how complaints are handled, up from 29.6%.
  #
  # Checked and NOT used for any measure on this page, deliberately. The regulator
  # requires councils to publish the results; it does not require them to set a
  # target, and Norwich has not published one for any of the twenty-six. A number
  # with nothing to compare it against cannot be scored without us inventing the
  # standard, which is the one thing this site never does. The page is banked so
  # the figures are on the record, and the absence of targets is recorded as a gap.
  - id: housing-tenant-satisfaction-measures
    title: "Tenant satisfaction measures 2025-26 — what council tenants say"
    type: performance
    stage: outcome
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/housing-and-community-safety/how-are-we-doing/tenant-satisfaction-measures-tsm-2025-26"
    follow_links: false
    enabled: true
