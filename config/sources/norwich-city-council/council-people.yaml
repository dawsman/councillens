    type: spending
    stage: null
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/your-council-explained/how-council-run-and-who-makes-decisions/councillors-allowances"
    redact: [uk_phone_numbers]
    follow_links: false
    documents:
