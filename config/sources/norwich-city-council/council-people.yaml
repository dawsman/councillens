# CouncilLens — Norwich City Council, who runs the council.
#
# This file gathers a different KIND of public record from the rest of
# config/sources/: not the trail of one decision, but the council's own account of
# who sits on it. `model: people` tells the analyse stage so — the topic build
# leaves these documents alone and src/analyse/build_people.py assembles them into
# data/analysed/norwich-city-council/people.json instead. Ingest, transform and
# the contract gate are identical either way.
#
# WHAT MAY GO IN HERE, AND WHAT MAY NOT
#
# Only the council's own publications, plus the Register of Members' Interests,
# which is the councillor's own declaration made under the Localism Act 2011 and
# published by the council that received it. Nothing from LinkedIn, X, Facebook or
# any other social network. Nothing from Companies House or any other database
# matched on a person's name. Nothing from the press. If a councillor's own
# website is printed on their council page, the address is recorded as the council
# prints it and is never fetched.
#
# Nothing about family, health or a home address. The registers give land at ward
# level and that is the level this project keeps.
#
# REDACTED AT INGEST: every source below carries `redact: [uk_phone_numbers]`.
# CMIS prints a personal mobile number for most councillors, and this project
# does not keep one — not on the page, and not in the archive either. The rule
# runs on the downloaded bytes before anything is saved or hashed, so the file in
# data/raw, the sha256 in the manifest, the extracted text and the site all show
# "[phone number removed]" and there is no unredacted copy anywhere, including in
# this repository's history. It is deliberately blunt and also takes out the
# council's own switchboard numbers where they appear on these pages: the
# council's website has those, and a rule that had to judge whose phone each
# number is would be a rule that sometimes got it wrong. The people topic records
# this as a gap so a reader knows the archive is not a byte-for-byte mirror.
#
# Every URL below was fetched and read on 2026-09-08 before being written down.
# Sources that could not be verified are disabled, with a note saying what was
# searched.

council: "Norwich City Council"
topic: "Council people (who runs the council)"
model: people

sources:
  # ------------------------------------------------------------------
  # THE COUNCILLORS — the council's own directory, and one page each
  # ------------------------------------------------------------------

  # Verified 2026-09-08. The directory CMIS publishes of everyone currently
  # sitting: 39 councillors, each with name, ward, party and the date of the
  # election they last won. `follow_pages` then fetches the page CMIS keeps for
  # each of them, which is where the detail lives — first elected, every term
  # served, party and ward history, current and past committee places, outside
  # bodies the council appointed them to, the dates of every register of
  # interests they have filed, declarations made at meetings, training, gifts and
  # hospitality, and a rolling twelve-month attendance record.
  #
  # follow_links is off: the directory links no documents, only pages.
  - id: norwich-councillors
    title: "Councillors — Norwich City Council's own directory"
    type: unknown
    stage: null
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Councillors.aspx"
    redact: [uk_phone_numbers]
    # CMIS renders a paginated list two ways. To a browser it gives JavaScript
    # postbacks, which this pipeline cannot follow; to a crawler it gives
    # ordinary links with the page number in the address. Saying honestly what we
    # are is what makes the rest of each councillor's committee list readable —
    # and it is the more polite thing to send a council's server anyway.
    user_agent: "CouncilLens-ingest/0.3 (+https://github.com/dawsman/councillens)"
    follow_links: false
    follow_pages:
      href_contains:
        - "ViewCMIS_Person"
      type: unknown
      max: 200
      # CMIS shows five rows of a councillor's committee list, five of their
      # outside bodies and five of their past places, then links the rest as
      # "2", "3" and so on. Those links are ordinary addresses, so the rest of
      # each list is fetched as its own record. Without this a councillor on ten
      # committees reads as a councillor on five, which understates their work
      # and makes committees look as though they have no chair.
      paginate:
        href_contains:
          - "grdRadCommitteesCurrentChangePage"
          - "grdRadOutsideBodiesCurrentChangePage"
        max: 6
    max_bytes: 3000000
    enabled: true

  # ------------------------------------------------------------------
  # WHAT THEY HAVE DECLARED — the Register of Members' Interests
  # ------------------------------------------------------------------

  # Verified 2026-09-08. Every councillor must declare, under the Localism Act
  # 2011, the things that could affect the decisions they take: a job, a
  # directorship, land, a licence, help with election costs. They fill the form in
  # themselves, the Monitoring Officer receives it, and the council publishes it.
  # It is a sworn declaration by the person, not an allegation about them.
  #
  # HOW THESE URLS WERE OBTAINED, AND WHY THEY ARE WRITTEN OUT IN FULL
  #
  # CMIS lists each councillor's registers on their own page as dates with a
  # "View" button. The button is an ASP.NET form post, not a link, so there is no
  # address on the page to follow. Pressing it redirects to an ordinary, signed
  # /Live/Document.ashx address that then serves the PDF to anyone, with no cookie
  # and no session. Those addresses are stable and repeatable — pressing the
  # button twice gives the same one — so each councillor's most recent register
  # was resolved once, by hand, on 2026-09-08, and written down here. That is the
  # same thing this project already does for CMIS committee reports, and it keeps
  # the pipeline to plain GETs.
  #
  # ONLY 17 OF THE 39 ARE HERE, AND THAT IS THE FINDING
  #
  # Norwich publishes 22 of the 39 registers as scanned pictures of a paper form,
  # with no text in the file at all. A scan is published, but it is not readable:
  # nothing can quote it, search it, or check it without a person retyping it, and
  # this project does not retype documents it cannot verify. Those 22 are not
  # banked — 22 MB of images the site could say nothing about — and every one of
  # them is recorded as a gap instead, with the address of the councillor's own
  # page so a reader can open the scan themselves.
  #
  # The 17 below are the ones the council published as real PDFs. 3.3 MB in total.
  - id: norwich-councillor-registers
    title: "Registers of members' interests — the 17 published in a readable form"
    type: unknown
    stage: null
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Councillors.aspx"
    redact: [uk_phone_numbers]
    include_page: false
    follow_links: false
    max_bytes: 5000000
    documents:
