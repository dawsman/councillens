  # ------------------------------------------------------------------
  # WHAT COUNCILLORS ARE PAID — allowances
  # ------------------------------------------------------------------

  # Verified 2026-09-08. An allowance is not a salary: it is a fixed sum for doing
  # the job, set by the council on the advice of an independent panel, plus extra
  # for people carrying extra responsibility. The council publishes what it paid
  # each councillor, one file per year, back to 2017-18. The most recent complete
  # year is banked; the page itself is the index of the rest.
