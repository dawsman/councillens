  # ------------------------------------------------------------------
  # TURNING UP — attendance
  # ------------------------------------------------------------------

  # Verified 2026-09-08. CMIS publishes attendance two ways, and both are in the
  # static HTML with no button to press. Each councillor's own page carries a
  # summary for a rolling twelve months, which is what this model's per-councillor
  # figures come from. This page carries the same thing arranged by committee —
  # every committee, every member, meetings expected, meetings attended, the
  # percentage, and substitutes sent. It is banked so a reader can check a
  # councillor's number against the committee it came from.
  - id: norwich-attendance-by-committee
    title: "Attendance at meetings, by committee"
    type: performance
    stage: null
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Councillors/tabid/63/ctl/ViewAttendanceByCommittee/mid/383/ScreenMode/Alphabetical/Default.aspx"
    redact: [uk_phone_numbers]
    follow_links: false
    max_bytes: 3000000
    enabled: true

  # ------------------------------------------------------------------
  # THE COMMITTEES — what the council splits itself into
  # ------------------------------------------------------------------

  # Verified 2026-09-08. CMIS's index of all 19 committees, each with a stable
  # address of its own. Membership and chairs come from the councillors' own pages
  # above, which carry the same facts with joining dates, so the individual
  # committee pages are not fetched as well.
  - id: norwich-committees
    title: "Committees — Norwich City Council's own index"
    type: unknown
    stage: null
    platform: cmis
    url: "https://cmis.norwich.gov.uk/live/Committees.aspx"
    redact: [uk_phone_numbers]
    follow_links: false
    enabled: true

  # Verified 2026-09-08. The council's own plain-English account of what each of
  # its committees is for — one short page per committee, written for residents.
  # CMIS gives a committee's membership and its papers but leaves the description
  # field empty, so this is the only place the council says in words what a
  # committee decides. `follow_pages` picks up the page for each committee.
  #
  # Not every committee has one: audit, treasury management and full council are
  # missing from the series, and that absence is recorded as a gap rather than
  # filled in with a description nobody published.
  - id: norwich-committee-types
