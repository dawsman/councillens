    type: unknown
    stage: null
    platform: localgov_drupal
    url: "https://www.norwich.gov.uk/your-council-explained/about-committees-and-meetings/types-committees"
    redact: [uk_phone_numbers]
    follow_links: false
    follow_pages:
      href_contains:
